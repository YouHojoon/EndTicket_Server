input {
    beats {
        port => 5100
    }
}
 
filter {
  dissect {
            mapping => { "[log][file][path]" => "/var/logs/%{service_name}-%{}.%{}.log"}
	}
}

output {
        elasticsearch {
                hosts => "elasticsearch:9200"
                index => "logstash-%{+yyyy.MM.dd}"
                user => "elastic"
                password => "1111"
                ecs_compatibility => disabled
        }
}
