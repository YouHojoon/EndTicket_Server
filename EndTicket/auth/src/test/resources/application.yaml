resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: count_based
        sliding-window-size: 1
        failure-rate-threshold: 100

jwt:
  secret: testtesttesttesttesttesttesttesttesttesttesttest
  access-token-expiration: 10000 # 1시간
  refresh-token-expiration: 604800000 # 30일
  refresh-token-reissue-expiration: 259200000

spring:
  kafka:
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: auth
    listener:
      concurrency: 3
      ack-mode: manual_immediate
  data:
    redis:
      port: 6382
      host: localhost
  cloud:
    config:
      enabled: false
eureka:
  client:
    enabled: false

grpc:
  server:
    in-process-name: test
    port: -1
  client:
    user:
      address: in-process:test
    token:
      address: in-process:test