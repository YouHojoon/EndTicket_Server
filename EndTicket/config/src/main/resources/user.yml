server:
  port: 8080
spring:
  application:
    name: user
  config:
    import:
      - classpath:/common/jpa.yml
      - classpath:/common/swagger.yml
      - classpath:/common/zipkin.yml
      - classpath:/common/kafka.yml
springdoc:
  paths-to-match:
    - "/users/**"
eureka:
  instance:
    metadata-map:
      gRPC_port: 9090
grpc:
  server:
    port: 9090

schedules:
  resend-user-deleted-event:
    fixed-delay: 600000
    inital-delay: 60000
