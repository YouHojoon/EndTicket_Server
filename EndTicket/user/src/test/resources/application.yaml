spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: root
    password: 1111

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        use_sql_comments: true
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
grpc:
  server:
    port: -1
    in-process-name: test
  client:
    user:
      address: in-process:test
