syntax = "proto3";

option java_multiple_files = true;
option java_package = "ac.kr.smu.protobuf";
option java_outer_classname = "AuthServiceProto";

service AuthService{
  rpc ValidationToken (AccessToken) returns (ValidationResponse);
}

message AccessToken{
  string token = 1;
}

message ValidationResponse{
  bool is_valid = 1;
  int64 user_id = 2;
  uint32 status = 3;
}