syntax = "proto3";

option java_multiple_files = true;
option java_package = "ac.kr.smu.protobuf";
option java_outer_classname = "TokenServiceProto";

service TokenService{
  rpc ValidateAccessToken (AccessToken) returns (ValidateAccessTokenResponse);
}

message AccessToken{
  string token = 1;
}

message ValidateAccessTokenResponse{
  int64 user_iD = 1;
  uint32 status = 2;
  string message = 3;
}